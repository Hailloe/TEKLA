<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>字幕</title>
<style>
  html, body { height: 100%; margin: 0; background: transparent; overflow: hidden; }
  body {
    display: flex; flex-direction: column; justify-content: flex-end; box-sizing: border-box;
    padding: 8px 16px 10px; user-select: none; cursor: default;
    font-family: "Microsoft YaHei", "PingFang SC", "Segoe UI", sans-serif;
  }
  /* Outlined text stays readable over any background. */
  .line { text-align: center; padding: 2px 0; }
  .zh {
    color: #fff; font-weight: 700; line-height: 1.35;
    text-shadow: 0 0 3px #000, 0 0 3px #000, 1px 1px 2px #000, -1px -1px 2px #000, 1px -1px 2px #000, -1px 1px 2px #000;
  }
  .en {
    color: #e5e7eb; line-height: 1.3; margin-top: 2px;
    text-shadow: 0 0 3px #000, 1px 1px 2px #000, -1px -1px 2px #000;
  }
  .who { color: #93c5fd; font-size: .75em; margin-right: 8px; }
  .line.live .zh, .line.live .en { color: #d1d5db; }
  .line:not(:last-child) { opacity: .6; }
  body.hide-en .en { display: none; }

  /* Unlocked: visible frame, drag anywhere to move, drag the edges to resize. */
  #hint { display: none; }
  body.unlocked { background: rgba(17, 24, 39, .55); outline: 2px dashed #60a5fa; outline-offset: -2px; -webkit-app-region: drag; }
  body.unlocked #hint {
    display: block; position: fixed; top: 6px; left: 0; right: 0; text-align: center;
    color: #fff; font-size: 12px; text-shadow: 0 0 3px #000;
  }
</style>
</head>
<body>
<div id="hint">拖动这里移动位置，拖边缘调大小 · 调好后按 Ctrl+Shift+L 锁定（锁定后鼠标可以点穿字幕）</div>
<div id="lines"></div>
<script>
  const linesEl = document.getElementById('lines');
  const render = (data) => {
    document.body.style.fontSize = Math.round(data.fs * 1.2) + 'px';
    document.body.classList.toggle('hide-en', !data.showEn);
    linesEl.replaceChildren(...data.lines.map((l) => {
      const div = document.createElement('div');
      div.className = 'line' + (l.live ? ' live' : '');
      const zh = document.createElement('div');
      zh.className = 'zh';
      if (l.who) zh.append(Object.assign(document.createElement('span'), { className: 'who', textContent: l.who }));
      zh.append(l.zh || '');
      const en = Object.assign(document.createElement('div'), { className: 'en', textContent: l.en || '' });
      en.style.fontSize = '.62em';
      div.append(zh, en);
      return div;
    }));
  };
  window.overlay.onSubtitles(render);
  window.overlay.onMode(({ locked }) => document.body.classList.toggle('unlocked', !locked));
</script>
</body>
</html>
