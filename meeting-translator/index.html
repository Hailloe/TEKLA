<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>实时翻译</title>
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<style>
  /* Apple-style business look: grouped background, white rounded cards, system blue. */
  :root {
    --bg: #f2f2f7; --card: #ffffff; --text: #1d1d1f; --muted: #6e6e73; --faint: #aeaeb2;
    --sep: rgba(60, 60, 67, .14); --fill: rgba(118, 118, 128, .12); --fill-strong: rgba(118, 118, 128, .2);
    --accent: #007aff; --accent-tint: rgba(0, 122, 255, .08); --danger: #ff3b30; --green: #34c759;
    --zh: #1d1d1f; --en: #6e6e73; --live: #aeaeb2;
    --bar: rgba(255, 255, 255, .72);
    --shadow: 0 1px 2px rgba(0, 0, 0, .04), 0 6px 20px rgba(0, 0, 0, .05);
    --fs: 22px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #000000; --card: #1c1c1e; --text: #f5f5f7; --muted: #98989d; --faint: #636366;
      --sep: rgba(84, 84, 88, .55); --fill: rgba(118, 118, 128, .24); --fill-strong: rgba(118, 118, 128, .36);
      --accent: #0a84ff; --accent-tint: rgba(10, 132, 255, .16); --danger: #ff453a;
      --zh: #f5f5f7; --en: #98989d; --live: #636366;
      --bar: rgba(28, 28, 30, .72); --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 20px rgba(0, 0, 0, .25);
    }
  }
  :root[data-theme="dark"] {
    --bg: #000000; --card: #1c1c1e; --text: #f5f5f7; --muted: #98989d; --faint: #636366;
    --sep: rgba(84, 84, 88, .55); --fill: rgba(118, 118, 128, .24); --fill-strong: rgba(118, 118, 128, .36);
    --accent: #0a84ff; --accent-tint: rgba(10, 132, 255, .16); --danger: #ff453a;
    --zh: #f5f5f7; --en: #98989d; --live: #636366;
    --bar: rgba(28, 28, 30, .72); --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 20px rgba(0, 0, 0, .25);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex; flex-direction: column;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  [hidden], [data-hidden] { display: none !important; }
  button, select, input { font: inherit; color: inherit; }
  button { cursor: pointer; border: none; background: none; -webkit-tap-highlight-color: transparent; }
  button:disabled { opacity: .45; cursor: default; }
  button:focus-visible, select:focus-visible, input:focus-visible { outline: 3px solid var(--accent-tint); outline-offset: 1px; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  code { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: .92em; background: var(--fill); padding: 1px 5px; border-radius: 5px; }

  /* Top bar: frosted glass */
  .topbar {
    position: sticky; top: 0; z-index: 5;
    display: flex; align-items: center; gap: 12px; padding: 10px 20px;
    background: var(--bar); backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px);
    border-bottom: .5px solid var(--sep);
  }
  .brand { display: flex; align-items: center; gap: 10px; margin-right: auto; min-width: 0; }
  .brand img { width: 32px; height: 32px; border-radius: 8px; flex: none; }
  .brand h1 { font-size: 17px; font-weight: 600; letter-spacing: -.02em; margin: 0; line-height: 1.2; }
  .brand .sub { display: block; font-size: 12px; color: var(--muted); }
  .pill {
    height: 32px; padding: 0 14px; border-radius: 999px; background: var(--fill);
    font-size: 13px; font-weight: 600; color: var(--text);
  }
  .pill:hover { background: var(--fill-strong); }
  .icon-btn {
    width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center;
    background: var(--fill); color: var(--text);
  }
  .icon-btn:hover { background: var(--fill-strong); }
  .icon-btn svg { width: 18px; height: 18px; }

  /* Controls card */
  .controls {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px;
    margin: 14px 20px 0; padding: 14px 16px; background: var(--card); border-radius: 18px; box-shadow: var(--shadow);
  }
  .field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .field > span { font-size: 12px; font-weight: 500; color: var(--muted); padding-left: 4px; }
  .select { position: relative; }
  .select::after {
    content: ""; position: absolute; right: 13px; top: 50%; width: 7px; height: 7px; pointer-events: none;
    border-right: 1.6px solid var(--muted); border-bottom: 1.6px solid var(--muted); transform: translateY(-70%) rotate(45deg);
  }
  .select select {
    appearance: none; -webkit-appearance: none; width: 100%;
    padding: 9px 32px 9px 12px; border: none; border-radius: 10px; background: var(--fill);
    font-size: 15px; color: var(--text); cursor: pointer;
  }

  /* Status + tools row */
  .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin: 12px 20px 4px; }
  .status-pill {
    display: flex; align-items: center; gap: 8px; min-height: 32px; padding: 6px 14px; margin-right: auto;
    background: var(--card); border-radius: 999px; box-shadow: var(--shadow); max-width: 100%;
  }
  .status-pill:has(#status:empty):has(#meter[hidden]) { visibility: hidden; }
  #status { font-size: 13px; color: var(--muted); }
  #status.err { color: var(--danger); }
  #meter { flex: none; width: 48px; height: 6px; border-radius: 3px; background: var(--fill); overflow: hidden; }
  #meter i { display: block; height: 100%; width: 0; background: var(--green); border-radius: 3px; transition: width .1s; }
  .tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .segmented { display: inline-flex; padding: 2px; border-radius: 999px; background: var(--fill); }
  .segmented button { height: 28px; min-width: 40px; padding: 0 12px; border-radius: 999px; font-size: 13px; font-weight: 600; }
  .segmented button:hover { background: var(--card); box-shadow: var(--shadow); }
  .chip {
    height: 32px; padding: 0 14px; border-radius: 999px; background: var(--card); box-shadow: var(--shadow);
    font-size: 13px; font-weight: 500; color: var(--text);
  }
  .chip:hover { color: var(--accent); }
  .chip.active { background: var(--accent); color: #fff; }

  /* Transcript */
  main { flex: 1; overflow-y: auto; padding: 8px 20px 16px; scroll-behavior: smooth; }
  .seg {
    background: var(--card); border-radius: 16px; box-shadow: var(--shadow);
    padding: 14px 18px; margin: 0 auto 10px; max-width: 980px;
  }
  .seg .zh { font-size: var(--fs); line-height: 1.45; color: var(--zh); font-weight: 600; letter-spacing: -.01em; }
  .seg .en { font-size: calc(var(--fs) * .66); line-height: 1.45; color: var(--en); margin-top: 4px; }
  .seg .en:empty { display: none; }
  .seg .t { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--faint); margin-top: 8px; font-variant-numeric: tabular-nums; }
  .seg .t .who { font-size: 11px; font-weight: 600; padding: 1px 8px; border-radius: 999px; background: var(--fill); color: var(--muted); }
  .seg.me { background: var(--accent-tint); box-shadow: none; }
  .seg.me .t .who { background: var(--accent); color: #fff; }
  .seg.live { background: transparent; box-shadow: inset 0 0 0 1px var(--sep); }
  .seg.live .zh, .seg.live .en { color: var(--live); }
  body.hide-en .seg .en { display: none; }
  .empty {
    max-width: 560px; margin: 8vh auto 0; padding: 28px 30px; text-align: center;
    background: var(--card); border-radius: 20px; box-shadow: var(--shadow);
    color: var(--muted); line-height: 1.8; font-size: 15px;
  }
  .empty b { color: var(--text); font-weight: 600; }

  /* Bottom dock */
  .dock {
    display: flex; align-items: center; gap: 6px; align-self: center;
    margin: 6px 16px 16px; padding: 6px; border-radius: 999px;
    background: var(--bar); backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px);
    box-shadow: 0 1px 2px rgba(0, 0, 0, .06), 0 10px 30px rgba(0, 0, 0, .12);
  }
  .dock-btn { height: 44px; padding: 0 18px; border-radius: 999px; color: var(--accent); font-size: 15px; font-weight: 500; }
  .dock-btn:hover { background: var(--fill); }
  #mic {
    height: 48px; min-width: 168px; padding: 0 26px; border-radius: 999px;
    background: var(--accent); color: #fff; font-size: 16px; font-weight: 600; letter-spacing: -.01em;
    box-shadow: 0 4px 14px rgba(0, 122, 255, .35);
  }
  #mic.on { background: var(--danger); box-shadow: 0 4px 14px rgba(255, 59, 48, .35); }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: currentColor; margin-right: 8px; vertical-align: middle; }
  #mic.on .dot { animation: pulse 1s infinite; }
  @keyframes pulse { 50% { opacity: .25; } }

  /* Settings sheet: iOS grouped list */
  dialog#settings {
    width: min(580px, calc(100% - 24px)); max-height: calc(100% - 32px); padding: 0;
    border: none; border-radius: 20px; background: var(--bg); color: var(--text);
    box-shadow: 0 24px 80px rgba(0, 0, 0, .3);
  }
  dialog#settings::backdrop { background: rgba(0, 0, 0, .32); backdrop-filter: blur(3px); }
  .sheet { padding-bottom: 22px; }
  .sheet-head {
    position: sticky; top: 0; z-index: 1; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
    padding: 14px 18px; background: var(--bar); backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px);
    border-bottom: .5px solid var(--sep);
  }
  .sheet-head h2 { grid-column: 2; margin: 0; font-size: 17px; font-weight: 600; }
  .sheet-head .done { grid-column: 3; justify-self: end; color: var(--accent); font-size: 17px; font-weight: 600; padding: 4px 6px; border-radius: 8px; }
  .group-title { font-size: 13px; color: var(--muted); padding: 22px 34px 7px; }
  .group { margin: 0 18px; background: var(--card); border-radius: 12px; overflow: hidden; }
  .row { display: flex; align-items: center; gap: 12px; min-height: 46px; padding: 6px 16px; }
  .row + .row { border-top: .5px solid var(--sep); }
  .row > span { flex: 0 0 auto; min-width: 96px; font-size: 15px; }
  .row input, .row select {
    flex: 1; min-width: 0; border: none; background: transparent; text-align: right;
    font-size: 16px; color: var(--muted); padding: 6px 0;
  }
  .row input:focus { color: var(--text); outline: none; }
  .row select { cursor: pointer; text-align-last: right; appearance: none; -webkit-appearance: none; padding-right: 18px;
    background: linear-gradient(45deg, transparent 50%, var(--faint) 50%) right 6px center / 6px 6px no-repeat,
                linear-gradient(-45deg, transparent 50%, var(--faint) 50%) right 0 center / 6px 6px no-repeat; }
  .row.stack { flex-direction: column; align-items: stretch; gap: 4px; padding: 10px 16px; }
  .row.stack input { text-align: left; color: var(--text); }
  .foot { font-size: 12.5px; color: var(--muted); line-height: 1.55; padding: 8px 34px 0; margin: 0; }

  @media (max-width: 600px) {
    .topbar { padding: 8px 14px; }
    .brand .sub { display: none; }
    .controls { grid-template-columns: 1fr 1fr; margin: 10px 12px 0; padding: 12px; gap: 10px; }
    .select select { font-size: 14px; padding: 9px 26px 9px 10px; }
    .select::after { right: 11px; }
    .toolbar { margin: 10px 12px 2px; }
    .status-pill { order: 2; width: 100%; }
    main { padding: 8px 12px 12px; }
    .dock { align-self: stretch; margin: 6px 12px 12px; }
    #mic { flex: 1; min-width: 0; }
  }
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <img src="icon.svg" alt="">
    <div><h1 data-i18n="appName">实时翻译</h1><span class="sub" data-i18n="appSub"></span></div>
  </div>
  <button id="langBtn" class="pill" title="Language / 界面语言">EN</button>
  <button id="settingsBtn" class="icon-btn" data-i18n-title="tipSettings">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
  </button>
</header>

<section class="controls">
  <label class="field" id="sourceField" hidden><span data-i18n="lblSource"></span>
    <div class="select"><select id="source">
      <option value="mic" data-i18n="srcMic"></option>
      <option value="system" data-i18n="srcSystem"></option>
      <option value="both" data-i18n="srcBoth"></option>
    </select></div>
  </label>
  <label class="field"><span data-i18n="lblFrom"></span>
    <div class="select"><select id="srcLang">
      <option value="en-US" data-i18n="l_en-US"></option>
      <option value="en-GB" data-i18n="l_en-GB"></option>
      <option value="en-AU" data-i18n="l_en-AU"></option>
      <option value="en-IN" data-i18n="l_en-IN"></option>
      <option value="en-SG" data-i18n="l_en-SG"></option>
      <option value="th-TH" data-i18n="l_th-TH"></option>
      <option value="ja-JP" data-i18n="l_ja-JP"></option>
      <option value="ko-KR" data-i18n="l_ko-KR"></option>
      <option value="vi-VN" data-i18n="l_vi-VN"></option>
      <option value="ms-MY" data-i18n="l_ms-MY"></option>
      <option value="id-ID" data-i18n="l_id-ID"></option>
      <option value="fr-FR" data-i18n="l_fr-FR"></option>
      <option value="de-DE" data-i18n="l_de-DE"></option>
      <option value="es-ES" data-i18n="l_es-ES"></option>
    </select></div>
  </label>
  <label class="field"><span data-i18n="lblTo"></span>
    <div class="select"><select id="dstLang">
      <option value="zh-CN" data-i18n="l_zh-CN"></option>
      <option value="zh-TW" data-i18n="l_zh-TW"></option>
    </select></div>
  </label>
  <label class="field"><span data-i18n="lblEngine"></span>
    <div class="select"><select id="engine">
      <option value="claude" data-i18n="engClaude"></option>
      <option value="openai" data-i18n="engOpenai"></option>
      <option value="google" data-i18n="engGoogle"></option>
      <option value="mymemory">MyMemory</option>
    </select></div>
  </label>
</section>

<div class="toolbar">
  <div class="status-pill"><div id="meter" hidden data-i18n-title="tipMeter"><i></i></div><div id="status"></div></div>
  <div class="tools">
    <div class="segmented">
      <button id="fsDown" data-i18n-title="tipFsDown">A−</button>
      <button id="fsUp" data-i18n-title="tipFsUp">A+</button>
    </div>
    <button id="toggleEn" class="chip" data-i18n="btnOriginal" data-i18n-title="tipOriginal"></button>
    <button id="pip" class="chip" data-i18n="btnPip" data-i18n-title="tipPip" hidden></button>
    <button id="ovl" class="chip" data-i18n-title="tipOvl" hidden></button>
    <button id="ovlLock" class="chip" data-i18n-title="tipOvlLock" hidden></button>
  </div>
</div>

<dialog id="settings">
<form method="dialog" class="sheet">
  <div class="sheet-head"><h2 data-i18n="setTitle"></h2><button class="done" value="ok" data-i18n="done"></button></div>
  <p class="foot" style="padding-top:14px" data-i18n="setPrivacy"></p>

  <div class="group-title">Claude</div>
  <div class="group">
    <label class="row"><span>API Key</span><input id="aiKey" type="password" autocomplete="off" placeholder="sk-ant-..."></label>
    <label class="row"><span data-i18n="model"></span>
      <select id="aiModel">
        <option value="claude-opus-5-5" data-i18n="mOpus"></option>
        <option value="claude-sonnet-5-5" data-i18n="mSonnet"></option>
        <option value="claude-haiku-5-5" data-i18n="mHaiku"></option>
      </select>
    </label>
  </div>
  <p class="foot" data-i18n-html="noteClaude"></p>

  <div class="group-title" data-i18n="grpOai"></div>
  <div class="group">
    <label class="row"><span>API Key</span><input id="oaiKey" type="password" autocomplete="off" placeholder="sk-..."></label>
    <label class="row"><span data-i18n="model"></span><input id="oaiModel" type="text" autocomplete="off" spellcheck="false"></label>
    <label class="row stack"><span data-i18n="baseUrl"></span><input id="oaiBase" type="url" autocomplete="off" spellcheck="false"></label>
  </div>
  <p class="foot" data-i18n-html="noteOai"></p>

  <div class="group-title" data-i18n="grpCtx"></div>
  <div class="group">
    <label class="row stack"><span data-i18n="ctxLabel"></span><input id="aiCtx" type="text" data-i18n-ph="ctxPh"></label>
  </div>

  <div class="group-title" data-i18n="grpStt"></div>
  <div class="group">
    <label class="row"><span data-i18n="sttMethod"></span>
      <select id="stt">
        <option value="browser" data-i18n="sttBrowser"></option>
        <option value="ai" data-i18n="sttAi"></option>
      </select>
    </label>
    <label class="row" data-stt="ai"><span>API Key</span><input id="sttKey" type="password" autocomplete="off" placeholder="sk-..."></label>
    <label class="row" data-stt="ai"><span data-i18n="model"></span><input id="sttModel" type="text" autocomplete="off" spellcheck="false"></label>
    <label class="row stack" data-stt="ai"><span data-i18n="sttBaseLbl"></span><input id="sttBase" type="url" autocomplete="off" spellcheck="false"></label>
  </div>
  <p class="foot" data-stt="ai" data-i18n-html="noteStt"></p>
</form>
</dialog>

<main id="list">
  <div class="empty" id="empty"></div>
</main>
<footer class="dock">
  <button id="clear" class="dock-btn" data-i18n="btnClear"></button>
  <button id="mic"><span class="dot"></span><span id="micLabel"></span></button>
  <button id="export" class="dock-btn" data-i18n="btnExport"></button>
</footer>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const list = $('list'), statusEl = $('status'), micBtn = $('mic'), micLabel = $('micLabel');
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  let running = false;
  let pipWin = null, pipSync = null; // floating subtitle window and its refresh, when open
  let desktopSync = null; // pushes the newest lines to the desktop overlay, in the desktop app

  // ---------- settings (per-device convenience) ----------
  const store = {
    get(k, d) { try { const v = localStorage.getItem('mt.' + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem('mt.' + k, JSON.stringify(v)); } catch {} }
  };
  // ---------- interface language (中文 / English) ----------
  const I18N = {
    zh: {
      appName: '实时翻译', appSub: '会议 · 视频 · 电视',
      tipSettings: '设置：API Key、AI 语音识别、会议专有名词',
      lblSource: '声音来源', srcMic: '🎤 麦克风', srcSystem: '💻 电脑声音（Teams / 视频）', srcBoth: '💻+🎤 电脑声音 + 我的麦克风',
      lblFrom: '说话语言', lblTo: '翻译成', lblEngine: '翻译引擎',
      'l_en-US': '英语（美）', 'l_en-GB': '英语（英）', 'l_en-AU': '英语（澳）', 'l_en-IN': '英语（印）', 'l_en-SG': '英语（新加坡）',
      'l_th-TH': '泰语', 'l_ja-JP': '日语', 'l_ko-KR': '韩语', 'l_vi-VN': '越南语', 'l_ms-MY': '马来语', 'l_id-ID': '印尼语',

      engClaude: 'Claude AI 翻译', engOpenai: 'DeepSeek / 其他 AI', engGoogle: 'Google 翻译',

  };
  let lang = store.get('ui', /^zh/i.test(navigator.language) ? 'zh' : 'en');
  const T = (k, ...a) => {
    const v = I18N[lang][k] ?? I18N.zh[k] ?? k;
    return typeof v === 'function' ? v(...a) : v;
  };

  const settings = {
    src: store.get('src', 'en-US'), dst: store.get('dst', 'zh-CN'),
    engine: store.get('engine', 'google'), fs: store.get('fs', 22), showEn: store.get('showEn', true),
    key: store.get('key', ''), model: store.get('model', 'claude-opus-5-5'), ctx: store.get('ctx', ''),
    oaiKey: store.get('oaiKey', ''), oaiModel: store.get('oaiModel', 'deepseek-v4-flash'),
    oaiBase: store.get('oaiBase', 'https://api.deepseek.com'),
    stt: store.get('stt', 'browser'), sttKey: store.get('sttKey', ''),
    sttModel: store.get('sttModel', 'FunAudioLLM/SenseVoiceSmall'),
    sttBase: store.get('sttBase', 'https://api.siliconflow.cn/v1')
  };
  if (![...$('aiModel').options].some((o) => o.value === settings.model)) settings.model = 'claude-opus-5-5';
  // Desktop subtitle app (Electron): the browser's built-in recognizer has no speech service
  // there, so AI recognition is the only option.
  const desktop = window.desktop || null;
  if (desktop) {
    settings.stt = 'ai';
    const opt = $('stt').querySelector('option[value="browser"]');
    opt.disabled = true;
    opt.dataset.i18nSuffix = 'sttDesktopNA';
  }
  $('aiKey').value = settings.key; $('aiModel').value = settings.model; $('aiCtx').value = settings.ctx;
  for (const k of ['oaiKey', 'oaiModel', 'oaiBase', 'sttKey', 'sttModel', 'sttBase']) $(k).value = settings[k];
  $('stt').value = settings.stt;
  const isAI = () => settings.engine === 'claude' || settings.engine === 'openai';
  const aiKey = () => (settings.engine === 'claude' ? settings.key : settings.oaiKey);
  const applyStt = () => {
    document.querySelectorAll('#settings [data-stt]').forEach((el) => {
      el.toggleAttribute('data-hidden', el.dataset.stt !== settings.stt);
    });
  };
  applyStt();
  const openSettings = () => { if (!$('settings').open) $('settings').showModal(); };
  $('settingsBtn').onclick = openSettings;
  $('stt').onchange = (e) => {
    settings.stt = e.target.value; store.set('stt', settings.stt); applyStt();
    if (running) { stop(); start(); }
  };
  $('aiKey').onchange = (e) => { settings.key = e.target.value.trim(); store.set('key', settings.key); };
  $('aiModel').onchange = (e) => { settings.model = e.target.value; store.set('model', settings.model); };
  const bindText = (id, k, fallback) => {
    $(id).onchange = (e) => {
      settings[k] = e.target.value.trim() || fallback;
      e.target.value = settings[k];
      store.set(k, settings[k]);
    };
  };
  bindText('oaiKey', 'oaiKey', '');
  bindText('oaiModel', 'oaiModel', 'deepseek-v4-flash');
  bindText('oaiBase', 'oaiBase', 'https://api.deepseek.com');
  bindText('sttKey', 'sttKey', '');
  bindText('sttModel', 'sttModel', 'FunAudioLLM/SenseVoiceSmall');
  bindText('sttBase', 'sttBase', 'https://api.siliconflow.cn/v1');
  $('aiCtx').onchange = (e) => { settings.ctx = e.target.value.trim(); store.set('ctx', settings.ctx); };
  $('srcLang').value = settings.src; $('dstLang').value = settings.dst; $('engine').value = settings.engine;
  const applyFs = () => {
    document.documentElement.style.setProperty('--fs', settings.fs + 'px');
    pipWin?.document.documentElement.style.setProperty('--fs', settings.fs + 'px');
    desktopSync?.();
  };
  const applyEn = () => {
    document.body.classList.toggle('hide-en', !settings.showEn);
    pipWin?.document.body.classList.toggle('hide-en', !settings.showEn);
    desktopSync?.();
  };
  applyFs(); applyEn();

  // Desktop Chrome/Edge 135+ can run speech recognition on a captured audio track
  // (Teams tab or system audio), so headphones work. Elsewhere only the microphone is available.
  const chromeVer = +((navigator.userAgent.match(/Chrom(?:e|ium)\/(\d+)/) || [])[1] || 0);
  const canSystem = chromeVer >= 135 && !/Android|Mobile/i.test(navigator.userAgent)
    && !!navigator.mediaDevices?.getDisplayMedia;
  settings.source = canSystem ? store.get('source', desktop ? 'system' : 'mic') : 'mic';
  $('sourceField').hidden = !canSystem;
  $('source').value = settings.source;
  $('empty').dataset.i18nHtml = desktop ? 'emptyDesktop' : 'emptyWeb';
  if (!desktop && canSystem) $('empty').dataset.i18nHtmlExtra = 'emptySystem';
  $('source').onchange = (e) => { settings.source = e.target.value; store.set('source', settings.source); if (running) { stop(); start(); } };
  $('srcLang').onchange = (e) => { settings.src = e.target.value; store.set('src', settings.src); if (running) restart(); };
  $('dstLang').onchange = (e) => { settings.dst = e.target.value; store.set('dst', settings.dst); };
  $('engine').onchange = (e) => {
    settings.engine = e.target.value; store.set('engine', settings.engine);
    if (isAI() && !aiKey()) openSettings();
  };
  $('fsUp').onclick = () => { settings.fs = Math.min(48, settings.fs + 2); store.set('fs', settings.fs); applyFs(); };
  $('fsDown').onclick = () => { settings.fs = Math.max(14, settings.fs - 2); store.set('fs', settings.fs); applyFs(); };

    settings.showEn = !settings.showEn; store.set('showEn', settings.showEn); applyEn();
    $('toggleEn').classList.toggle('active', settings.showEn);

  // ---------- floating subtitle window (Document Picture-in-Picture, desktop Chrome/Edge) ----------
  // An always-on-top, movie-subtitle style window showing the newest lines, to sit over a
  // video or a Teams call. It has its own start/stop and font-size buttons.
  if ('documentPictureInPicture' in window) $('pip').hidden = false;
  $('pip').onclick = async () => {
    if (pipWin) { pipWin.close(); return; }
    let w;
    try {
      w = await documentPictureInPicture.requestWindow({ width: 760, height: 150 });
    } catch (e) {
      setStatus(T('errPip', e.message), true);
      return;
    }
    pipWin = w;
    const d = w.document;
    document.querySelectorAll('style').forEach((st) => d.head.appendChild(st.cloneNode(true)));
    const extra = d.createElement('style');
    extra.textContent = `
      body { height: 100vh; padding: 0; background: #000; color: #fff; }
      #pipBar { position: fixed; top: 4px; right: 6px; display: flex; gap: 4px; opacity: .3; transition: opacity .2s; z-index: 1; }
      body:hover #pipBar { opacity: 1; }
      #pipBar button { background: rgba(255,255,255,.14); color: #fff; padding: 3px 11px; font-size: 12px; border-radius: 999px; }
      #pipBar button.on { background: #ff3b30; }
      #pipList { flex: 1; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; padding: 6px 18px 10px; }
      #pipList .seg { border: none; padding: 3px 0; text-align: center; background: transparent; box-shadow: none; border-radius: 0; margin: 0; max-width: none; }
      #pipList .seg.me { background: transparent; }
      #pipList .zh { color: #fff; font-size: calc(var(--fs) * 1.15); font-weight: 600; }
      #pipList .en { color: #b8b8b8; }
      #pipList .seg.live .zh, #pipList .seg.live .en { color: #9a9a9a; }
      #pipList .seg:not(:last-child) { opacity: .55; }
      #pipList .t { display: none; }
      #pipList .who { color: #64d2ff; font-size: .8em; margin-right: 6px; }
      #pipList .empty { color: #9a9a9a; margin: auto; font-size: 14px; }`;
    d.head.appendChild(extra);
    d.title = T('pipTitle');
    d.documentElement.style.setProperty('--fs', settings.fs + 'px');
    d.body.classList.toggle('hide-en', !settings.showEn);
    d.body.innerHTML = `<div id="pipBar"><button id="pRun"></button><button id="pDown">A−</button><button id="pUp">A+</button></div><main id="pipList"></main>`;
    const box = d.getElementById('pipList'), run = d.getElementById('pRun');
    run.onclick = () => micBtn.click();
    d.getElementById('pUp').onclick = () => $('fsUp').click();
    d.getElementById('pDown').onclick = () => $('fsDown').click();
    const render = () => {
      run.textContent = running ? T('pipStop') : T('pipStart');
      run.classList.toggle('on', running);
      const segs = [...list.querySelectorAll('.seg')].slice(-2);
      box.replaceChildren(...(segs.length
        ? segs.map((el) => {
          const c = el.cloneNode(true);
          const who = el.dataset.who;
          if (who && c.querySelector('.zh').textContent) {
            c.querySelector('.zh').prepend(Object.assign(d.createElement('span'), { className: 'who', textContent: T('who_' + who) }));
          }

        : [Object.assign(d.createElement('div'), { className: 'empty', textContent: running ? T('pipListening') : T('pipIdle') })]));
    };
    const mo = new MutationObserver(render);
    mo.observe(list, { childList: true, subtree: true, characterData: true });
    pipSync = render;
    render();
    $('pip').dataset.i18n = 'btnPipClose'; $('pip').textContent = T('btnPipClose');
    w.addEventListener('pagehide', () => {
      mo.disconnect();

      $('pip').dataset.i18n = 'btnPip'; $('pip').textContent = T('btnPip');

  // ---------- desktop subtitle overlay (only inside the Electron app) ----------
  if (desktop) {
    $('pip').remove();
    $('ovl').hidden = false; $('ovlLock').hidden = false;
    $('ovl').onclick = () => desktop.toggleOverlay();
    $('ovlLock').onclick = () => desktop.toggleLock();
    desktop.onOverlayState(({ visible, locked }) => {

      $('ovlLock').dataset.i18n = locked ? 'ovlLocked' : 'ovlUnlocked';

    $('ovlLock').dataset.i18n = 'ovlLocked';
    desktopSync = () => {

  function setStatus(msg, isErr) { statusEl.textContent = msg || ''; statusEl.classList.toggle('err', !!isErr); }

  // ---------- translation ----------
  const cache = new Map();
  const srcCode = () => settings.src.split('-')[0];
  async function translate(text) {
    text = text.trim();
    if (!text) return '';
    const order = settings.engine === 'mymemory' ? [mymemory, google] : [google, mymemory];
    const key = order[0].name + '|' + settings.src + '|' + settings.dst + '|' + text;
    if (cache.has(key)) return cache.get(key);
    let lastErr;
    for (const fn of order) {
      try {
        const out = await fn(text, settings.dst);
        if (out) { cache.set(key, out); return out; }
      } catch (e) { lastErr = e; }
    }
    throw lastErr || new Error(T('translateFail'));
  }
  async function google(text, dst) {
    const url = 'https://translate.googleapis.com/translate_a/single?client=gtx&dt=t&sl=' + srcCode() + '&tl='
      + encodeURIComponent(dst) + '&q=' + encodeURIComponent(text);
    const r = await fetch(url);
    if (!r.ok) throw new Error('Google ' + r.status);
    const j = await r.json();
    return (j[0] || []).map((p) => p[0]).join('');
  }
  async function mymemory(text, dst) {
    const url = 'https://api.mymemory.translated.net/get?langpair=' + srcCode() + '|' + encodeURIComponent(dst)
      + '&q=' + encodeURIComponent(text.slice(0, 480));
    const r = await fetch(url);
    if (!r.ok) throw new Error('MyMemory ' + r.status);
    const j = await r.json();
    if (j.responseStatus !== 200 && j.responseStatus !== '200') throw new Error(j.responseDetails || 'MyMemory: ' + T('svcErr'));
    return j.responseData.translatedText;
  }

  const LANG_NAMES = { en: 'English', th: 'Thai', ja: 'Japanese', ko: 'Korean', vi: 'Vietnamese',
    ms: 'Malay', id: 'Indonesian', fr: 'French', de: 'German', es: 'Spanish' };

  // System prompt and user message shared by the AI engines.
  function buildPrompt(seg) {
    const srcName = LANG_NAMES[srcCode()] || settings.src;
    const dstName = settings.dst === 'zh-TW' ? 'Traditional Chinese (繁體中文)' : 'Simplified Chinese (简体中文)';
    let system = `You are a professional live interpreter. Each user message contains one new segment of a live speech-recognition transcript in ${srcName}. Translate it into natural, fluent ${dstName}, the way a skilled human interpreter would say it. Speech recognition sometimes mishears words or splits sentences oddly; use the recent context to infer what the speaker meant. Reply with only the translation of the new segment - no quotes, notes, or original text.`;
    if (settings.ctx) system += `\n\nBackground and terminology from the listener:\n${settings.ctx}`;
    // Earlier segments still being translated are included as source text only.
    const prev = segments.slice(0, segments.indexOf(seg)).slice(-3)
      .map((s) => (s.zh ? `${s.en}\n=> ${s.zh}` : s.en)).join('\n\n');
    const content = (prev ? `Recent context:\n${prev}\n\n` : '') + `New segment to translate:\n${seg.en}`;
    return { system, content };
  }

  // POSTs a streaming request and feeds each SSE `data:` payload to onData.
  // Times out after 25s; clearing the transcript aborts it.
  const inflight = new Set();
  async function streamSSE(name, url, headers, body, onData) {
    const ctl = new AbortController();
    const timer = setTimeout(() => ctl.abort(), 25000);
    inflight.add(ctl);
    let reader;
    try {
      let r;
      try {
        r = await fetch(url, { method: 'POST', headers, body: JSON.stringify(body), signal: ctl.signal });
      } catch (e) {
        if (e.name === 'AbortError') throw e;
        throw new Error(T('connFail', name));
      }
      if (!r.ok) {
        let detail = '';
        try { const j = await r.json(); detail = j.error?.message || j.message || ''; } catch {}
        throw new Error(T('httpErr', name, r.status, detail));
      }
      reader = r.body.getReader();
      const dec = new TextDecoder();
      let buf = '';
      const handle = (chunk) => {
        for (const line of chunk.split('\n')) {
          if (line.startsWith('data:')) onData(line.slice(5).trim());
        }
      };
      for (;;) {
        const { done, value } = await reader.read();
        if (done) break;
        buf += dec.decode(value, { stream: true });
        let i;
        while ((i = buf.indexOf('\n\n')) >= 0) {
          handle(buf.slice(0, i));
          buf = buf.slice(i + 2);
        }
      }
      handle(buf + dec.decode());
    } catch (e) {
      if (e.name === 'AbortError') throw new Error(T('timeout', name));
      throw e;
    } finally {
      clearTimeout(timer);
      inflight.delete(ctl);
      try { reader && (await reader.cancel()); } catch {}
    }
  }

  // Claude Messages API, called straight from the browser; onText gets the text so far.
  async function claude(seg, onText) {
    if (!settings.key) throw new Error(T('needKey', 'Claude'));
    const { system, content } = buildPrompt(seg);
    const body = {
      model: settings.model, max_tokens: 2048, stream: true,
      output_config: { effort: 'low' },
      system, messages: [{ role: 'user', content }]
    };
    const headers = {
      'content-type': 'application/json',
      'x-api-key': settings.key,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true'
    };
    // Server-side fallback if a safety classifier declines (not offered for Haiku).
    if (settings.model !== 'claude-haiku-5-5') {
      body.fallbacks = 'default';
      headers['anthropic-beta'] = 'server-side-fallback-2026-07-01';
    }
    let out = '', stop = null;
    await streamSSE('Claude', 'https://api.anthropic.com/v1/messages', headers, body, (data) => {
      let ev;
      try { ev = JSON.parse(data); } catch { return; }
      // On a mid-stream server-side fallback the partial text is kept and the fallback model continues it.
      if (ev.type === 'content_block_delta' && ev.delta?.type === 'text_delta') {
        out += ev.delta.text;
        onText(out);
      } else if (ev.type === 'message_delta' && ev.delta?.stop_reason) {
        stop = ev.delta.stop_reason;
      } else if (ev.type === 'error') {
        throw new Error('Claude: ' + (ev.error?.message || T('svcErr')));
      }
    });
    if (stop === 'refusal') throw new Error(T('refusal'));
    return out.trim();
  }

  // OpenAI-compatible chat completions (DeepSeek by default).
  async function openaiCompat(seg, onText) {
    const name = /deepseek/i.test(settings.oaiBase) ? 'DeepSeek' : 'AI';
    if (!settings.oaiKey) throw new Error(T('needKey', name));
    const { system, content } = buildPrompt(seg);
    const body = {
      model: settings.oaiModel, stream: true, temperature: 0.3,
      messages: [{ role: 'system', content: system }, { role: 'user', content }]
    };
    // DeepSeek V4 thinks by default; translation doesn't need it and thinking adds seconds.
    if (name === 'DeepSeek') body.thinking = { type: 'disabled' };
    const url = settings.oaiBase.replace(/\/+$/, '') + '/chat/completions';
    const headers = { 'content-type': 'application/json', authorization: 'Bearer ' + settings.oaiKey };
    let out = '';
    await streamSSE(name, url, headers, body, (data) => {
      if (data === '[DONE]') return;
      let ev;
      try { ev = JSON.parse(data); } catch { return; }
      if (ev.error) throw new Error(name + ': ' + (ev.error.message || T('svcErr')));
      const piece = ev.choices?.[0]?.delta?.content;
      if (piece) { out += piece; onText(out); }
    });
    return out.trim();
  }

  // ---------- transcript UI ----------
  const segments = []; // {time, en, zh, who}  who: 'me' | 'them' | '' (unlabelled)
  const whoLabel = (who) => (who ? T('who_' + who) : '');
  // Caption under a sentence: speaker badge + time; re-rendered when the interface language changes.
  function renderMeta(el) {
    const t = el.querySelector('.t');
    if (!t || !el.dataset.time) return;
    const parts = [];
    if (el.dataset.who) parts.push(Object.assign(document.createElement('span'), { className: 'who', textContent: whoLabel(el.dataset.who) }));
    parts.push(document.createTextNode(el.dataset.time));

  }
  const isChinese = (t) => /[\u4e00-\u9fff]/.test(t) && !/[a-z]{3}/i.test(t);
  let liveEl = null, liveText = '', liveTimer = null, liveReq = 0;

  function fmtTime(d) { return d.toTimeString().slice(0, 8); }
  function nearBottom() { return list.scrollHeight - list.scrollTop - list.clientHeight < 120; }
  function scrollDown(force) { if (force || nearBottom()) list.scrollTop = list.scrollHeight; }
  function makeSeg(cls) {
    $('empty')?.remove();
    const el = document.createElement('div');
    el.className = 'seg' + (cls ? ' ' + cls : '');
    el.innerHTML = '<div class="zh"></div><div class="en"></div><div class="t"></div>';
    return el;
  }

  function showLive(text) {
    const stick = nearBottom();
    if (!liveEl) { liveEl = makeSeg('live'); list.appendChild(liveEl); }
    liveEl.querySelector('.en').textContent = text;
    liveText = text;
    // Throttled preview translation of the still-changing sentence.
    if (!liveTimer) {
      liveTimer = setTimeout(async () => {
        liveTimer = null;
        const id = ++liveReq, t = liveText;
        try {
          const zh = await translate(t);
          if (id === liveReq && liveEl) liveEl.querySelector('.zh').textContent = zh;
        } catch {}
      }, 600);
    }
    scrollDown(stick);

  // Finalizes one recognized sentence and translates it. By default it takes over the
  // browser recognizer's live line; AI recognition passes its own placeholder element.
  async function commit(text, opts = {}) {
    text = text.trim();
    let el = opts.el;
    if (!text) { el?.remove(); return; }
    const stick = nearBottom();
    if (!el) {
      liveReq++;
      el = liveEl;
      liveEl = null;
      if (!el) { el = makeSeg(); list.appendChild(el); }
    }
    el.classList.remove('live');
    const who = opts.who || '';
    if (who === 'me') el.classList.add('me');
    const seg = { time: opts.time || new Date(), en: text, zh: '', who };
    segments.push(seg);
    el.querySelector('.en').textContent = text;
    if (who) el.dataset.who = who;
    el.dataset.time = fmtTime(seg.time);
    renderMeta(el);
    scrollDown(stick);
    const zhEl = el.querySelector('.zh');
    // My own Chinese needs no translation; show it as the main line.
    if (who === 'me' && isChinese(text)) {
      seg.zh = text;
      zhEl.textContent = text;
      el.querySelector('.en').textContent = '';
      return;
    }
    // Only the newest segment reports status, so a slow older request can't hide a newer error.
    const report = (msg, isErr) => { if (segments[segments.length - 1] === seg) setStatus(msg, isErr); };
    let note = '';
    if (isAI()) {
      try {
        const ai = settings.engine === 'claude' ? claude : openaiCompat;
        seg.zh = await ai(seg, (partial) => { zhEl.textContent = partial; scrollDown(stick); });
        zhEl.textContent = seg.zh;
        report(running ? T('listening') : '');
        scrollDown(stick);
        return;
      } catch (e) {
        if (!segments.includes(seg)) return; // transcript was cleared
        note = T('fellBack', e.message);
      }
    }
    try {
      seg.zh = await translate(text);
      zhEl.textContent = seg.zh;
      report(note || (running ? T('listening') : ''), !!note);
    } catch (e) {
      zhEl.textContent = T('cellFail');
      report(T('translateConnFail', e.message), true);
    }
    scrollDown(stick);
  }

  // ---------- AI speech recognition (OpenAI-compatible /audio/transcriptions) ----------
  // A simple energy-based voice detector cuts the audio into sentences; each one is encoded
  // as 16 kHz WAV and sent for transcription. Works with SenseVoice, Whisper, etc.
  function encodeWav(chunks, rate) {
    const total = chunks.reduce((n, c) => n + c.length, 0);
    const ratio = rate / 16000, n = Math.floor(total / ratio);
    const pcm = new Int16Array(n);
    let ci = 0, off = 0, pos = 0;
    for (let i = 0; i < n; i++) {
      const target = Math.floor(i * ratio);
      while (pos + chunks[ci].length <= target) { pos += chunks[ci].length; ci++; }
      off = target - pos;
      const v = Math.max(-1, Math.min(1, chunks[ci][off]));
      pcm[i] = v < 0 ? v * 0x8000 : v * 0x7fff;
    }
    const buf = new ArrayBuffer(44 + pcm.byteLength), dv = new DataView(buf);
    const str = (o, t) => [...t].forEach((c, i) => dv.setUint8(o + i, c.charCodeAt(0)));
    str(0, 'RIFF'); dv.setUint32(4, 36 + pcm.byteLength, true); str(8, 'WAVE');
    str(12, 'fmt '); dv.setUint32(16, 16, true); dv.setUint16(20, 1, true); dv.setUint16(22, 1, true);
    dv.setUint32(24, 16000, true); dv.setUint32(28, 32000, true); dv.setUint16(32, 2, true); dv.setUint16(34, 16, true);
    str(36, 'data'); dv.setUint32(40, pcm.byteLength, true);
    new Int16Array(buf, 44).set(pcm);
    return new Blob([buf], { type: 'audio/wav' });
  }

  // Watches one audio stream and calls onStart() when speech begins and onEnd(wav|null) when it ends.
  function createVad(ctx, stream, onStart, onEnd) {
    const src = ctx.createMediaStreamSource(stream);
    const proc = ctx.createScriptProcessor(4096, 1, 1);
    const mute = ctx.createGain();
    mute.gain.value = 0;
    src.connect(proc); proc.connect(mute); mute.connect(ctx.destination);
    const rate = ctx.sampleRate, chunkMs = 4096 / rate * 1000;
    const preroll = Math.ceil(300 / chunkMs);
    let noise = 0.004, speaking = false, cur = [], pre = [], silentMs = 0, speechMs = 0;
    proc.onaudioprocess = (e) => {
      const data = new Float32Array(e.inputBuffer.getChannelData(0));
      let sum = 0;
      for (const v of data) sum += v * v;
      const rms = Math.sqrt(sum / data.length);
      const thr = Math.max(0.008, noise * 3);
      if (!speaking) {
        pre.push(data);
        if (pre.length > preroll) pre.shift();
        if (rms > thr) {
          speaking = true; cur = pre; pre = []; silentMs = 0; speechMs = chunkMs;
          onStart();
        } else {
          noise = noise * 0.95 + rms * 0.05;
        }
        return;
      }
      cur.push(data);
      if (rms > thr) { silentMs = 0; speechMs += chunkMs; } else silentMs += chunkMs;
      // A sentence ends after 0.7 s of quiet, or is cut at 12 s to keep latency bounded.
      if (silentMs > 700 || cur.length * chunkMs > 12000) {
        speaking = false;
        const chunks = cur;
        cur = [];
        onEnd(speechMs >= 300 ? encodeWav(chunks, rate) : null);
      }
    };
    return () => { proc.onaudioprocess = null; try { src.disconnect(); proc.disconnect(); } catch {} };
  }

  async function transcribe(wav, who) {
    const fd = new FormData();
    fd.append('file', wav, 'speech.wav');
    fd.append('model', settings.sttModel);
    // Whisper-style models take a language hint; my own speech may be Chinese, so leave it open.
    if (/whisper|transcribe/i.test(settings.sttModel) && who !== 'me') fd.append('language', srcCode());
    const ctl = new AbortController();
    const timer = setTimeout(() => ctl.abort(), 30000);
    inflight.add(ctl);
    try {
      let r;
      try {
        r = await fetch(settings.sttBase.replace(/\/+$/, '') + '/audio/transcriptions', {
          method: 'POST', headers: { authorization: 'Bearer ' + settings.sttKey }, body: fd, signal: ctl.signal
        });
      } catch (e) {
        if (e.name === 'AbortError') throw new Error(T('timeout', T('sttName')));
        throw new Error(T('connFail', T('sttName')));
      }
      if (!r.ok) {
        let detail = '';
        try { const j = await r.json(); detail = j.error?.message || j.message || ''; } catch {}
        throw new Error(T('httpErr', T('sttName'), r.status, detail));
      }
      const j = await r.json();
      // SenseVoice may tag language/emotion/events like <|en|><|NEUTRAL|>; drop the tags.
      return (j.text || '').replace(/<\|[^|]*\|>/g, '').trim();
    } finally {
      clearTimeout(timer);
      inflight.delete(ctl);
    }
  }

  // One VAD + transcription pipeline per input; `who` labels the speaker when both are on.
  function startAiPipeline(ctx, stream, who) {
    let el = null, startedAt = null;
    const stopVad = createVad(ctx, stream, () => {
      const stick = nearBottom();
      el = makeSeg('live');
      if (who) el.dataset.who = who;
      el.querySelector('.en').textContent = (who ? whoLabel(who) + ': ' : '') + '🎙️ …';
      startedAt = new Date();
      list.appendChild(el);
      scrollDown(stick);
      if (!quietShown) setStatus(T('heard'));
    }, async (wav) => {
      const mine = el, time = startedAt;
      el = null;
      if (!wav) { mine.remove(); return; }
      mine.querySelector('.en').textContent = (who ? whoLabel(who) + ': ' : '') + T('recognizing');
      try {
        const text = await transcribe(wav, who);
        if (!mine.isConnected) return; // transcript was cleared
        commit(text, { el: mine, who, time });
      } catch (e) {
        mine.remove();
        setStatus(e.message, true);
      }
    });
    // Stopping mid-sentence drops the unfinished placeholder.
    return () => { stopVad(); el?.remove(); el = null; };
  }

  // ---------- speech recognition ----------
  let rec = null, wakeLock = null, restartTimer = null, capture = null, audioTrack = null;
  let micStream = null, audioCtx = null, recTrack = null, stopPipelines = [];
  const recStart = (r) => {
    try {
      recTrack ? r.start(recTrack) : r.start();
    } catch (e) {
      if (e.name === 'InvalidStateError' && !recTrack) return; // already running
      setStatus(T('srStartFail', e.message, !!recTrack), true);
    }
  };

  // Volume meter, so it is obvious whether any sound reaches the page at all.
  let meterCtx = null, meterMic = null, meterTimer = null, quietSince = 0, quietShown = false;
  const QUIET_MSG = () => (audioTrack
    ? T('quietSystem') : T('quietMic'));
  async function startMeter() {
    try {
      const track = recTrack || audioTrack || micStream?.getAudioTracks()[0];
      if (!track) meterMic = await navigator.mediaDevices.getUserMedia({ audio: true });
      const stream = track ? new MediaStream([track]) : meterMic;
      meterCtx = new AudioContext();
      await meterCtx.resume();
      const an = meterCtx.createAnalyser();
      an.fftSize = 1024;
      meterCtx.createMediaStreamSource(stream).connect(an);
      const buf = new Float32Array(an.fftSize);
      const bar = $('meter').firstElementChild;
      $('meter').hidden = false;
      quietSince = Date.now(); quietShown = false;
      meterTimer = setInterval(() => {
        an.getFloatTimeDomainData(buf);
        let sum = 0;
        for (const v of buf) sum += v * v;
        const level = Math.min(1, Math.sqrt(sum / buf.length) * 8);
        bar.style.width = Math.round(level * 100) + '%';
        if (level > 0.04) {
          quietSince = Date.now();
          if (quietShown) { quietShown = false; setStatus(T('soundBack')); }
        } else if (!quietShown && Date.now() - quietSince > 6000) {
          quietShown = true;
          setStatus(QUIET_MSG(), true);
        }
      }, 100);
    } catch {}
  }
  function stopMeter() {
    clearInterval(meterTimer); meterTimer = null;
    try { meterCtx && meterCtx.close(); } catch {}
    meterCtx = null;
    meterMic?.getTracks().forEach((t) => t.stop());
    meterMic = null;
    $('meter').hidden = true;
  }

  // Asks the user to share a tab/screen with audio; returns false if they cancel or share no audio.
  async function startCapture() {
    try {
      capture = await navigator.mediaDevices.getDisplayMedia({
        video: { frameRate: 1 },
        audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false },
        systemAudio: 'include'
      });
    } catch {
      setStatus(T('shareCancel'), true);
      return false;
    }
    audioTrack = capture.getAudioTracks()[0] || null;
    if (!audioTrack) {
      stopCapture();
      setStatus(T('noAudioShared'), true);
      return false;
    }
    audioTrack.onended = () => { if (running) stop(); };
    return true;
  }
  function stopCapture() {
    capture?.getTracks().forEach((t) => t.stop());
    capture = null; audioTrack = null;
  }

  function buildRec() {
    const r = new SR();
    r.lang = settings.src;
    r.continuous = true;
    r.interimResults = true;
    r.maxAlternatives = 1;
    r.onresult = (ev) => {
      let interim = '';
      for (let i = ev.resultIndex; i < ev.results.length; i++) {
        const res = ev.results[i];
        if (res.isFinal) commit(res[0].transcript);
        else interim += res[0].transcript;
      }
      if (interim.trim()) showLive(interim.trim());
    };
    r.onspeechstart = () => { if (!quietShown) setStatus(T('heard')); };
    r.onerror = (ev) => {
      if (ev.error === 'no-speech' || ev.error === 'aborted') return;
      if (ev.error === 'audio-capture') { setStatus(T('audioCapture'), true); return; }
      if (ev.error === 'not-allowed' || ev.error === 'service-not-allowed') {
        setStatus(T('micDenied'), true);
        stop();
      } else if (ev.error === 'network') {
        setStatus(T('srNetwork'), true);
      } else {
        setStatus(T('srError', ev.error), true);
      }
    };
    // Browsers end recognition after silence or ~60s; restart while the user wants it on.
    r.onend = () => {
      if (liveEl && liveText) commit(liveText);
      liveText = '';
      if (running && r === rec) { clearTimeout(restartTimer); restartTimer = setTimeout(() => recStart(r), 250); }
    };
    return r;
  }

  async function start() {
    const useAI = settings.stt === 'ai';
    if (!SR && !useAI) {
      setStatus(T('noSR'), true);
      return;
    }
    if (useAI && !settings.sttKey) {
      openSettings();
      setStatus(T('needSttKey'), true);
      return;
    }
    const src = settings.source;
    if (src !== 'mic' && !(await startCapture())) return;
    // The browser recognizer opens the microphone itself; AI recognition and mixing need the stream.
    if (src === 'both' || (useAI && src === 'mic')) {
      try {
        micStream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } });
      } catch {
        stopCapture();
        setStatus(T('micUnavailable'), true);
        return;
      }
    }
    running = true;
    audioCtx = new AudioContext();
    try { await audioCtx.resume(); } catch {}
    if (useAI) {
      const label = src === 'both';
      if (audioTrack) stopPipelines.push(startAiPipeline(audioCtx, new MediaStream([audioTrack]), label ? 'them' : ''));
      if (micStream) stopPipelines.push(startAiPipeline(audioCtx, micStream, label ? 'me' : ''));
    } else {
      recTrack = audioTrack;
      if (src === 'both') {
        // One browser recognizer can only take one track, so mix the call audio with my microphone.
        const mix = audioCtx.createMediaStreamDestination();
        audioCtx.createMediaStreamSource(new MediaStream([audioTrack])).connect(mix);
        audioCtx.createMediaStreamSource(micStream).connect(mix);
        recTrack = mix.stream.getAudioTracks()[0];
      }
      rec = buildRec();
      recStart(rec);
    }
    micBtn.classList.add('on'); micLabel.textContent = T('micStop');
    setStatus((useAI ? T('aiPrefix') : '') + T({ mic: 'listening', system: 'listeningSystem', both: 'listeningBoth' }[src]));
    startMeter();
    pipSync?.(); desktopSync?.();
    try { wakeLock = await navigator.wakeLock?.request('screen'); } catch {}
  }
  function stop() {
    running = false;
    clearTimeout(restartTimer);
    try { rec && rec.stop(); } catch {}
    rec = null;
    stopPipelines.forEach((f) => f());
    stopPipelines = [];
    stopMeter();
    stopCapture();
    micStream?.getTracks().forEach((t) => t.stop());
    micStream = null; recTrack = null;
    try { audioCtx && audioCtx.close(); } catch {}
    audioCtx = null;
    micBtn.classList.remove('on'); micLabel.textContent = T('micStart');
    pipSync?.(); desktopSync?.();
    if (!statusEl.classList.contains('err')) setStatus(T('stopped'));
    try { wakeLock && wakeLock.release(); } catch {}
    wakeLock = null;
  }
  // Language change: the browser recognizer must restart; AI recognition reads it per request.
  function restart() { if (!rec) return; try { rec.abort(); } catch {} rec = buildRec(); recStart(rec); }

  micBtn.onclick = () => (running ? stop() : start());
  document.addEventListener('visibilitychange', async () => {
    if (running && document.visibilityState === 'visible' && !wakeLock) {
      try { wakeLock = await navigator.wakeLock?.request('screen'); } catch {}
    }
  });

  $('clear').onclick = () => {
    if (segments.length && !confirm(T('confirmClear'))) return;
    inflight.forEach((c) => c.abort());
    segments.length = 0; list.innerHTML = ''; liveEl = null;
  };
  $('export').onclick = () => {
    if (!segments.length) { setStatus(T('nothingToExport')); return; }
    const body = segments.map((s) => `[${fmtTime(s.time)}]${s.who ? ' ' + whoLabel(s.who) : ''}\n`
      + (s.en === s.zh ? s.zh : `${s.en}\n${s.zh}`) + '\n').join('\n');
    const blob = new Blob([body], { type: 'text/plain;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = T('exportName') + '-' + new Date().toISOString().slice(0, 16).replace(/[:T]/g, '-') + '.txt';
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  };

  // Re-renders every translatable piece of the interface in the current language.
  function applyLang() {
    document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
    document.title = T('appName');
    document.querySelectorAll('[data-i18n]').forEach((el) => {
      el.textContent = T(el.dataset.i18n) + (el.dataset.i18nSuffix ? T(el.dataset.i18nSuffix) : '');
    });
    document.querySelectorAll('[data-i18n-html]').forEach((el) => {
      el.innerHTML = T(el.dataset.i18nHtml) + (el.dataset.i18nHtmlExtra ? T(el.dataset.i18nHtmlExtra) : '');
    });
    document.querySelectorAll('[data-i18n-title]').forEach((el) => { el.title = T(el.dataset.i18nTitle); el.setAttribute('aria-label', el.title); });
    document.querySelectorAll('[data-i18n-ph]').forEach((el) => { el.placeholder = T(el.dataset.i18nPh); });
    document.querySelectorAll('.seg').forEach(renderMeta);
    micLabel.textContent = T(running ? 'micStop' : 'micStart');
    $('langBtn').textContent = lang === 'zh' ? 'EN' : '中文';
    $('toggleEn').classList.toggle('active', settings.showEn);
    pipSync?.(); desktopSync?.();
  }
  $('langBtn').onclick = () => {
    lang = lang === 'zh' ? 'en' : 'zh';
    store.set('ui', lang);
    applyLang();
    if (!statusEl.classList.contains('err')) setStatus(running ? T('listening') : '');
  };
  applyLang();

  if (!SR && settings.stt !== 'ai') setStatus(T('noSR'), true);
  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
})();
</script>
</body>
</html>
